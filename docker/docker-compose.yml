# Legacy CLI Compose example. Requires a local start.sh and should not be used
# for the new WebUI image. Prefer ../docker-compose.yml at repository root.
networks:
  tg_host:
    external: false

services:
  tg-signer:
    image: ghcr.io/lwhx/tg-signer:latest
    container_name: tg-signer
    command: ["/bin/bash", "start.sh"]
    volumes:
      - $PWD:/opt/tg-signer
    environment:
      - TG_PROXY=${TG_PROXY:-}
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - tg_host
    restart: unless-stopped

# Optional hardened overlay. Test your environment before enabling.
# docker compose -f docker-compose.yml -f docker-compose.readonly.yml up -d
#
# These options affect ONLY the container root filesystem.
# The existing ./data:/opt/tg-signer bind mount remains writable.

services:
  webui:
    read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      XDG_CACHE_HOME: /tmp/.cache

  automation:
    read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      XDG_CACHE_HOME: /tmp/.cache

name: tg-signer-dashboard
services:
  dashboard:
    image: ghcr.io/lwhx/tg-signer:latest-dashboard
    container_name: tg-signer-dashboard
    restart: unless-stopped
    init: true
    ports:
      - "${WEBUI_BIND_IP:-127.0.0.1}:${WEBUI_PORT:-8999}:8999"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

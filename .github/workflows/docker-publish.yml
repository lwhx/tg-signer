name: Publish Dashboard Docker Image

on:
  workflow_run:
    workflows:
      - Dashboard CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
      image_tag:
        description: Dashboard image tag for manual build
        required: true
        default: manual-dashboard

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Publish only a trusted, successful push to main (not a forked PR).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
      - name: Read revision
        id: git
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate tags
        id: tags
        env:
          RUN_TYPE: ${{ github.event_name }}
          USER_TAG: ${{ inputs.image_tag }}
          SHA: ${{ steps.git.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          if [ "$RUN_TYPE" = "workflow_dispatch" ]; then
            tag="$USER_TAG"
          else
            tag="main-${SHA:0:12}-dashboard"
          fi
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag: $tag" >&2
            exit 1
          fi
          {
            echo "tags<<EOF"
            echo "ghcr.io/${REPOSITORY}:$tag"
            if [ "$RUN_TYPE" = "workflow_run" ]; then
              echo "ghcr.io/${REPOSITORY}:latest-dashboard"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push Dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=lwhx-tg-signer-dashboard
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.git.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

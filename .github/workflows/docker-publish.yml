name: Publish Docker Image

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
      image_tag:
        description: Docker image tag to publish for this manual run
        required: true
        default: manual-test

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    # workflow_run executes with package write permission. Only trust green,
    # direct pushes on the default branch of this repository.
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: cli
            tag_suffix: ''
            latest_tag: latest
          - target: webui
            tag_suffix: -webui
            latest_tag: latest-webui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref || github.ref }}

      - name: Capture checked-out source revision
        id: source
        shell: bash
        run: echo "revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: prep
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG_NAME: ${{ github.ref_name }}
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.revision }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            ref_name="${MANUAL_IMAGE_TAG}"
          elif [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            ref_name="main-${SOURCE_SHA:0:12}"
          else
            ref_name="${PUSH_TAG_NAME}"
          fi

          image="${REGISTRY}/${IMAGE_NAME}"

          if [[ ! "${ref_name}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Unsupported Docker tag format: ${ref_name}" >&2
            exit 1
          fi

          {
            echo "version_tag=${ref_name}${{ matrix.tag_suffix }}"
            echo "tags<<EOF"
            echo "${image}:${ref_name}${{ matrix.tag_suffix }}"
            if [[ "${EVENT_NAME}" == "push" || "${EVENT_NAME}" == "workflow_run" ]]; then
              echo "${image}:${{ matrix.latest_tag }}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/GHCR.Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          labels: |
            org.opencontainers.image.title=lwhx-tg-signer
            org.opencontainers.image.description=Automated Telegram tasks with check-ins, monitoring, forwarding, and auto replies.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=${{ steps.prep.outputs.version_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
